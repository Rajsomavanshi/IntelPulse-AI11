openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: intelligence
    description: Agentic competitive intelligence operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /intelligence:
    post:
      operationId: runIntelligence
      tags: [intelligence]
      summary: Run an intelligence investigation
      description: Plans an investigation, selects relevant evidence tools, analyzes results, and returns prioritized intelligence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceInput"
      responses:
        "200":
          description: Intelligence investigation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceReport"
        "400":
          description: Invalid investigation request
        "500":
          description: Investigation failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    IntelligenceInput:
      type: object
      required: [company, competitors, technology, period]
      properties:
        company:
          type: string
          minLength: 2
          maxLength: 120
        competitors:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 120
          minItems: 0
          maxItems: 12
        technology:
          type: string
          minLength: 2
          maxLength: 240
        period:
          type: string
          enum: [7d, 30d, 90d, 1y]
        demoMode:
          type: boolean
          default: false
    ToolCall:
      type: object
      required: [id, name, reason, query, resultCount, status, selected]
      properties:
        id: { type: string }
        name: { type: string }
        reason: { type: string }
        query: { type: string }
        resultCount: { type: number }
        status: { type: string, enum: [not_selected, running, completed, unavailable, empty] }
        selected: { type: boolean }
        timestamp: { type: string }
        source: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
    Finding:
      type: object
      required: [id, category, title, company, date, impact, classification, whyItMatters, action, source, confidence]
      properties:
        id: { type: string }
        category: { type: string, enum: [research, patent, news] }
        title: { type: string }
        company: { type: string }
        date: { type: string }
        impact: { type: number }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        classification: { type: string, enum: [opportunity, threat, neutral] }
        whyItMatters: { type: string }
        action: { type: string }
        source: { type: string }
        sourceType: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
        confidenceScore: { type: number }
        evidenceCount: { type: number }
    Trend:
      type: object
      required: [label, value, direction, description]
      properties:
        label: { type: string }
        value: { type: number }
        direction: { type: string, enum: [up, flat, down] }
        description: { type: string }
    Recommendation:
      type: object
      required: [priority, title, detail, owner]
      properties:
        priority: { type: string, enum: [now, next, watch] }
        title: { type: string }
        detail: { type: string }
        owner: { type: string }
    AgentPlan:
      type: object
      required: [objective, subtasks, selectedTools, reasoningSummary]
      properties:
        objective: { type: string }
        subtasks:
          type: array
          items: { type: string }
        selectedTools:
          type: array
          items: { type: string }
        reasoningSummary:
          type: array
          items: { type: string }
    IntelligenceReport:
      type: object
      required: [runId, mode, input, executiveSummary, criticalAlerts, findings, trends, recommendations, toolCalls, metrics, plan, intelligenceScore]
      properties:
        runId: { type: string }
        mode: { type: string, enum: [live, demo] }
        input:
          $ref: "#/components/schemas/IntelligenceInput"
        executiveSummary: { type: string }
        criticalAlerts:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        trends:
          type: array
          items: { $ref: "#/components/schemas/Trend" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        toolCalls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
        plan:
          $ref: "#/components/schemas/AgentPlan"
        intelligenceScore:
          type: object
          required: [overall, marketMomentum, researchMomentum, patentActivity, developerEcosystem, threatLevel, opportunityLevel]
          properties:
            overall: { type: number }
            marketMomentum: { type: number }
            researchMomentum: { type: number }
            patentActivity: { type: number }
            developerEcosystem: { type: number }
            threatLevel: { type: string }
            opportunityLevel: { type: string }
        metrics:
          type: object
          required: [sources, verified, competitors, opportunityCount, threatCount]
          properties:
            sources: { type: number }
            verified: { type: number }
            competitors: { type: number }
            opportunityCount: { type: number }
            threatCount: { type: number }

