kind = "web"
previewPath = "/"
title = "IntelPulse AI"
description = "An autonomous competitive intelligence workspace that discovers, verifies, prioritizes, and turns research, patent, and competitor signals into actionable recommendations."
version = "1.0.0"
id = "artifacts/intel-pulse-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18204

[services.development]
run = "pnpm --filter @workspace/intel-pulse-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/intel-pulse-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/intel-pulse-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18204"
BASE_PATH = "/"
